# Dependabot para el propio repo de reusable workflows.
# Aquí viven casi todas las actions de terceros que usan las pipelines de la
# org (google-github-actions/*, docker/*, actions/*): actualizarlas aquí las
# actualiza para todos los consumidores al cortar la siguiente release.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
