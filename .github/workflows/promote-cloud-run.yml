# =============================================================================
# REUSABLE WORKFLOW: PROMOTE TO PRODUCTION
# =============================================================================
# Promotes an existing image from AR to production. No build — just deploy
# by digest, then move tags on success.
#
# Digest-first flow:
#   1. Resolve user input → source tag → source digest (ONCE, upfront)
#   2. Verify the digest's OCI source revision tree == github.sha tree
#   3. Capture current pro-latest digest (for pro-previous backup on success)
#   4. Capture currently-serving Cloud Run revision (for auto-rollback)
#   5. Deploy Cloud Run by digest (tags are not touched yet)
#   6. Smoke test
#   7. Only on success: move pro-latest, pro-previous, and semver tags.
#   8. On failure: shift Cloud Run traffic back to the saved revision;
#      tags remain untouched, so AR state == what's actually running.
#
# Why digest-first: between 'read stg-latest' and 'write pro-latest' a
# concurrent push to main can move stg-latest. Resolving to a digest up
# front and using it for deploy + later tag moves eliminates that race.
#
# The version input accepts:
#   - Commit hash (b075fa6 / full 40-char) → sha-b075fa6
#   - Semver (1.4.0 / v1.4.0) → source is stg-latest, tagged as v1.4.0
#                               on success
#   - AR tag (sha-b075fa6, stg-latest, pro-previous) → used as-is
#   - Empty on a push event → auto-resolve by merge provenance (PTF-302):
#       hotfix/feature PR merge → the PR's own commit-bound preview image
#       (pr-<N>-<sha7>); release-sprint-* merge → the release head's
#       commit-bound image (sha-<sha7>); direct push → sha-<github.sha7>.
#
# Exact-tree provenance guard (PTF-302): every source tag is first pinned to
# a digest. The OCI revision label is then read from that exact digest and
# both the image revision and github.sha are resolved to their full Git tree
# hashes. Production is touched only when those trees are identical. This
# catches mutable-tag drift, an in-flight release, and (critically) a stale PR
# preview built before the PR base changed from release to main. The guard is
# fail-closed and also applies to workflow_dispatch.
#
# Features:
#   - Pre-deploy context: shows source vs production image comparison
#   - Smoke test with auto-rollback on any post-deploy failure
#   - CDN cache invalidation
#   - GitHub Deployments API: registers each deploy for traceability
#
# For staging builds, use deploy-cloud-run.yml instead.
#
# Destination: Dogfy-Diet/.github/.github/workflows/promote-cloud-run.yml
#
# Required GitHub variables:
#   Repository level : AR_REPO      (e.g. europe-west1-docker.pkg.dev/dogfy-host/docker)
#   Per environment  : GCP_PROJECT  (e.g. dogfy-platform-pro)
#                      SA_EMAIL     (deployer SA for this service)
#                      WIF_PROVIDER (WIF provider full resource name)
# =============================================================================
name: Promote to Production

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "Cloud Run service name (must match Terraform)"
      version:
        required: false
        default: ""
        type: string
        description: "Version to promote. Accepts: commit hash (b075fa6), semver (v1.4.0 or 1.4.0), tag (stg-latest, sha-b075fa6). Empty is only valid on a push event, where merge provenance is auto-resolved."
      environment:
        type: string
        default: "production"
        description: "GitHub environment. Defaults to production."
      region:
        type: string
        default: "europe-west1"
      smoke_test_path:
        type: string
        default: ""
        description: "Health check path (e.g. /health). Empty = skip."
      cdn_host:
        type: string
        default: ""
        description: "Host to invalidate CDN cache for. Requires CDN_URL_MAP GitHub env variable. Empty = skip."
      sa_email:
        type: string
        default: ""
        description: "Deployer SA email. For monorepos with multiple services. Defaults to vars.SA_EMAIL if empty."
    outputs:
      image:
        value: ${{ jobs.promote.outputs.image }}
      digest:
        value: ${{ jobs.promote.outputs.digest }}
      tree:
        value: ${{ jobs.promote.outputs.tree }}
      url:
        value: ${{ jobs.promote.outputs.url }}

jobs:
  promote:
    name: "Promote to ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.src.outputs.ar_image }}
      digest: ${{ steps.src.outputs.digest }}
      tree: ${{ steps.provenance.outputs.image_tree }}
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      id-token: write
      deployments: write
      # Needed by the auto-resolve step (commits/{sha}/pulls). Callers must
      # grant it too. If PR metadata is unavailable, auto-resolution falls
      # back to the commit-bound sha-<github.sha7> tag, never to stg-latest.
      pull-requests: read

    steps:
      # Check out the caller's exact event commit so the target tree does not
      # depend on GitHub's REST commit index. This matters when main is not the
      # default branch: a fresh direct/bypassed main commit can be fetchable by
      # Git while the Git objects REST endpoint still returns 404.
      - uses: actions/checkout@v4

      # ================================================================
      # AUTH
      # ================================================================
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ inputs.sa_email || vars.SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # ================================================================
      # AUTO-RESOLVE SOURCE (push event, no explicit version) — PTF-302
      # Decides WHAT a push to main should promote, by merge provenance:
      #   - Hotfix/feature PR merge → the PR's own commit-bound preview
      #     image pr-<N>-<sha7>. NOT stg-latest, which on non-trunk repos
      #     points at the in-flight sprint.
      #   - Release merge (release-sprint-*) → sha-<release-head-sha7>,
      #     the immutable commit-bound alias created by the staging deploy.
      #   - No PR found (direct push) → sha-<github.sha7>. This normally
      #     does not exist and therefore fails closed before deployment.
      #
      # Source selection is not trusted on its own. The exact-tree guard
      # below proves that the selected digest's built revision has the same
      # complete repository tree as github.sha.
      # ================================================================
      - name: Auto-resolve source (push)
        id: auto
        if: github.event_name == 'push' && inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merge_commit_sha == "${{ github.sha }}")][0] // empty' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            BOUND_TAG="sha-${GITHUB_SHA:0:7}"
            echo "No merged PR found for ${GITHUB_SHA:0:7} (direct push?) — requiring commit-bound image ${BOUND_TAG}"
            echo "src_tag=${BOUND_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_NUMBER=$(echo "$PR" | jq -r '.number')
          HEAD_SHA=$(echo "$PR" | jq -r '.head.sha')
          HEAD_REF=$(echo "$PR" | jq -r '.head.ref')

          if echo "$HEAD_REF" | grep -qE '^release-sprint-'; then
            BOUND_TAG="sha-$(echo "$HEAD_SHA" | cut -c1-7)"
            echo "PR #${PR_NUMBER} is a release merge (${HEAD_REF}) — promoting its commit-bound staging image ${BOUND_TAG}"
            echo "src_tag=${BOUND_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BOUND_TAG="pr-${PR_NUMBER}-$(echo "$HEAD_SHA" | cut -c1-7)"
          echo "PR #${PR_NUMBER} (${HEAD_REF}) merged as ${GITHUB_SHA:0:7} — promoting its commit-bound image ${BOUND_TAG}"
          echo "src_tag=${BOUND_TAG}" >> "$GITHUB_OUTPUT"

      # ================================================================
      # RESOLVE VERSION — NORMALIZE USER INPUT TO A SOURCE TAG
      # Semver is a SHORTCUT meaning "promote whatever is currently on
      # staging, and also label the image with this version number".
      #   b075fa6 / b075fa6c3d9e...  → src_tag=sha-b075fa6    is_semver=false
      #   1.4.0 / v1.4.0             → src_tag=stg-latest     is_semver=true  semver_tag=v1.4.0
      #   sha-b075fa6                → src_tag=sha-b075fa6    is_semver=false
      #   stg-latest / pro-previous  → src_tag=<as-is>        is_semver=false
      # Precedence: auto-resolved source (push) > explicit input.
      # An empty workflow_dispatch is rejected: production never silently
      # falls back to a mutable tag.
      # ================================================================
      - name: Resolve version
        id: version
        run: |
          RAW="${{ steps.auto.outputs.src_tag || inputs.version }}"
          if [ -z "$RAW" ]; then
            echo "::error::A source version is required outside an auto-resolved push event; refusing implicit stg-latest"
            exit 1
          fi

          if echo "$RAW" | grep -qE '^[0-9a-f]{7,40}$'; then
            SRC_TAG="sha-${RAW:0:7}"
            IS_SEMVER=false
            SEMVER_TAG=""
          elif echo "$RAW" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            SRC_TAG="stg-latest"
            IS_SEMVER=true
            SEMVER_TAG="v${RAW#v}"
          else
            SRC_TAG="$RAW"
            IS_SEMVER=false
            SEMVER_TAG=""
          fi

          {
            echo "src_tag=${SRC_TAG}"
            echo "is_semver=${IS_SEMVER}"
            echo "semver_tag=${SEMVER_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: input='${RAW}' → src_tag=${SRC_TAG} is_semver=${IS_SEMVER} semver_tag=${SEMVER_TAG:-none}"

      # ================================================================
      # RESOLVE SOURCE DIGEST (SINGLE SOURCE OF TRUTH)
      # From here on, everything operates on digests, never on mutable
      # tags — so that a concurrent push to main that moves `stg-latest`
      # between steps cannot affect this promote.
      # ================================================================
      - name: Resolve source digest
        id: src
        env:
          AR_IMAGE: ${{ vars.AR_REPO }}/${{ inputs.service }}
          SRC_TAG: ${{ steps.version.outputs.src_tag }}
        run: |
          SRC_DIGEST=$(gcloud artifacts docker images describe \
            "${AR_IMAGE}:${SRC_TAG}" \
            --format='value(image_summary.digest)' 2>/dev/null)
          if [ -z "$SRC_DIGEST" ]; then
            echo "::error::Source tag ${SRC_TAG} not found in AR"
            case "$SRC_TAG" in
              pr-*)
                echo "::error::The PR's preview build likely failed or never ran for its head commit, so there is no commit-bound image to promote. Re-run the preview on that commit, or promote a known-good image explicitly via workflow_dispatch."
                ;;
            esac
            exit 1
          fi
          if ! [[ "$SRC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Artifact Registry returned an invalid digest for ${SRC_TAG}"
            exit 1
          fi
          echo "ar_image=${AR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${SRC_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Source: ${AR_IMAGE}:${SRC_TAG} @ ${SRC_DIGEST}"

      # ================================================================
      # EXACT-TREE PROVENANCE GUARD — PTF-302
      # Read the built commit and exact checked-out tree from the already-
      # pinned source digest's OCI labels, resolve the target commit tree, and
      # require equality. Older images without io.dogfy.git.tree fall back to
      # resolving their revision commit. Comparing trees (not ancestry) is
      # intentional:
      # squash/merge commits may have different IDs while representing the
      # same content, whereas an ancestor image may still omit a production
      # hotfix or contain a different synthetic PR merge.
      #
      # This guard applies to every source tag and every event, including
      # workflow_dispatch. Missing/ambiguous labels or inaccessible commits
      # fail closed. It runs before Cloud Run or production tags are touched.
      # ================================================================
      - name: Verify exact source tree
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          AR_IMAGE: ${{ steps.src.outputs.ar_image }}
          SRC_DIGEST: ${{ steps.src.outputs.digest }}
        run: |
          set -euo pipefail

          REGISTRY_HOST="${AR_IMAGE%%/*}"
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet

          IMAGE_JSON=$(docker buildx imagetools inspect \
            "${AR_IMAGE}@${SRC_DIGEST}" \
            --format '{{json .Image}}')

          # docker/build-push-action can publish either a single image config
          # or an index keyed by platform. Require every platform to carry the
          # same non-empty label; a partially labelled index is not trusted.
          read_consistent_label() {
            local label="$1"
            jq -er --arg label "$label" '
              (if has("config") then [.]
               else [.[] | select(type == "object" and has("config"))]
               end) as $images
              | [$images[].config.Labels[$label] // ""] as $values
              | if ($values | length) == 0
                   or any($values[]; . == "")
                   or (($values | unique | length) != 1)
                then error("missing or inconsistent OCI label: " + $label)
                else $values[0]
                end
            ' <<< "$IMAGE_JSON"
          }

          # The durable tree label was added after the revision guard. An
          # entirely absent value is therefore allowed for backward
          # compatibility, but a partially labelled/inconsistent index is not.
          read_optional_consistent_label() {
            local label="$1"
            jq -er --arg label "$label" '
              (if has("config") then [.]
               else [.[] | select(type == "object" and has("config"))]
               end) as $images
              | [$images[].config.Labels[$label] // ""] as $values
              | if ($values | length) == 0
                then error("no image configs")
                elif all($values[]; . == "")
                then ""
                elif any($values[]; . == "")
                     or (($values | unique | length) != 1)
                then error("inconsistent optional OCI label: " + $label)
                else $values[0]
                end
            ' <<< "$IMAGE_JSON"
          }

          if ! IMAGE_REVISION=$(read_consistent_label 'org.opencontainers.image.revision'); then
            echo "::error::Cannot verify provenance for ${SRC_DIGEST:0:19}...: missing or inconsistent org.opencontainers.image.revision label"
            exit 1
          fi
          if ! [[ "$IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Image revision label is not a full Git commit SHA: '${IMAGE_REVISION}'"
            exit 1
          fi

          if ! IMAGE_SOURCE=$(read_consistent_label 'org.opencontainers.image.source'); then
            echo "::error::Cannot verify provenance for ${SRC_DIGEST:0:19}...: missing or inconsistent org.opencontainers.image.source label"
            exit 1
          fi

          EXPECTED_SOURCE="https://github.com/${{ github.repository }}"
          if [ "$IMAGE_SOURCE" != "$EXPECTED_SOURCE" ]; then
            echo "::error::Image source '${IMAGE_SOURCE}' does not match '${EXPECTED_SOURCE}'"
            exit 1
          fi

          if ! IMAGE_TREE=$(read_optional_consistent_label 'io.dogfy.git.tree'); then
            echo "::error::Cannot verify provenance for ${SRC_DIGEST:0:19}...: inconsistent io.dogfy.git.tree label"
            exit 1
          fi

          if [ -n "$IMAGE_TREE" ]; then
            if ! [[ "$IMAGE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Image tree label is not a full Git tree SHA: '${IMAGE_TREE}'"
              exit 1
            fi
            IMAGE_TREE_SOURCE="image label"
          else
            IMAGE_TREE=$(gh api \
              "repos/${{ github.repository }}/git/commits/${IMAGE_REVISION}" \
              --jq '.tree.sha' 2>/dev/null || true)
            IMAGE_TREE_SOURCE="revision fallback"
          fi

          TARGET_TREE=$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)

          # On a fallback API error `gh api` may emit the JSON error body to
          # stdout even though the command failed. Treat only full Git object
          # IDs as resolved trees so an inaccessible/non-existent revision
          # gets the intended remediation message instead of a mismatch.
          if ! [[ "$IMAGE_TREE" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$TARGET_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot resolve Git trees (image revision=${IMAGE_REVISION}, target=${GITHUB_SHA})"
            exit 1
          fi

          if [ "$IMAGE_TREE" != "$TARGET_TREE" ]; then
            echo "::error::Artifact tree mismatch: image ${IMAGE_REVISION:0:12} has tree ${IMAGE_TREE:0:12}, but target ${GITHUB_SHA:0:12} has tree ${TARGET_TREE:0:12}. Production was not changed."
            exit 1
          fi

          {
            echo "image_revision=${IMAGE_REVISION}"
            echo "image_tree=${IMAGE_TREE}"
            echo "target_tree=${TARGET_TREE}"
          } >> "$GITHUB_OUTPUT"
          echo "Provenance OK: ${SRC_DIGEST:0:19}... was built from ${IMAGE_REVISION:0:12}; tree ${IMAGE_TREE:0:12} (${IMAGE_TREE_SOURCE}) exactly matches ${GITHUB_SHA:0:12}"

      # ================================================================
      # CAPTURE CURRENT PRO-LATEST DIGEST
      # Saved now (not moved) so pro-previous only advances after a
      # successful deploy. If the promote fails, pro-latest is untouched
      # and this workflow can be safely re-run.
      # ================================================================
      - name: Capture current pro-latest digest
        id: prev
        env:
          AR_IMAGE: ${{ steps.src.outputs.ar_image }}
        run: |
          PREV_DIGEST=$(gcloud artifacts docker images describe \
            "${AR_IMAGE}:pro-latest" \
            --format='value(image_summary.digest)' 2>/dev/null || true)
          echo "digest=${PREV_DIGEST}" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_DIGEST" ]; then
            echo "Current pro-latest: ${PREV_DIGEST}"
          else
            echo "No existing pro-latest (first promote for this service)"
          fi

      # ================================================================
      # PRE-DEPLOY CONTEXT — visible to approval reviewers
      # ================================================================
      - name: Pre-deploy context
        env:
          AR_IMAGE: ${{ steps.src.outputs.ar_image }}
          SRC_DIGEST: ${{ steps.src.outputs.digest }}
          PREV_DIGEST: ${{ steps.prev.outputs.digest }}
          SRC_TAG: ${{ steps.version.outputs.src_tag }}
          IMAGE_REVISION: ${{ steps.provenance.outputs.image_revision }}
          VERIFIED_TREE: ${{ steps.provenance.outputs.image_tree }}
        run: |
          # Find the sha-* tag that matches each digest (for human-readable context)
          find_sha_tag() {
            local digest="$1"
            [ -z "$digest" ] && echo "(none)" && return
            for img in $(gcloud artifacts docker images list "${AR_IMAGE}" \
              --include-tags --filter="digest=${digest}" \
              --format='value(tags)' 2>/dev/null); do
              SHA=$(echo "$img" | tr ',' '\n' | grep "^sha-" | head -1)
              [ -n "$SHA" ] && echo "$SHA" && return
            done
            echo "${SRC_TAG}"
          }

          SRC_SHA=$(find_sha_tag "$SRC_DIGEST")
          PRO_SHA=$(find_sha_tag "$PREV_DIGEST")

          SYNC_STATUS=""
          if [ "$SRC_DIGEST" = "$PREV_DIGEST" ] && [ -n "$SRC_DIGEST" ]; then
            SYNC_STATUS="| **Status** | Already in sync |"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<CTXEOF
          ### Pre-deploy Context
          | Environment | Image Tag | Digest |
          |---|---|---|
          | Source | \`${SRC_SHA}\` | \`${SRC_DIGEST:0:19}...\` |
          | Production | \`${PRO_SHA}\` | \`${PREV_DIGEST:0:19}...\` |

          | Provenance | Verified value |
          |---|---|
          | Image revision | \`${IMAGE_REVISION:0:12}\` |
          | Exact Git tree | \`${VERIFIED_TREE}\` |

          ${SYNC_STATUS}

          **Promoting \`${SRC_SHA}\` → production** (replacing \`${PRO_SHA}\`)
          CTXEOF

      # ================================================================
      # SAVE CURRENTLY-SERVING REVISION (for auto-rollback on failure)
      # Uses the traffic split, not just the newest revision — preview
      # deploys create newer revisions with 0% traffic.
      # ================================================================
      - name: Save currently-serving revision
        id: pre-deploy
        run: |
          REVISION=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }} \
            --format='json' 2>/dev/null \
            | jq -r '.status.traffic[] | select(.percent==100 and (.tag == null or .tag == "")) | .revisionName' \
            | head -1 || true)
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Serving revision before deploy: ${REVISION:-none}"

      # ================================================================
      # DEPLOY (always by digest — tags remain unchanged until success)
      # ================================================================
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ inputs.service }} \
            --image=${{ steps.src.outputs.ar_image }}@${{ steps.src.outputs.digest }} \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }}

      - name: Route traffic to latest revision
        # `gcloud run deploy` does NOT shift traffic when an explicit split
        # is already pinned on the service — which is the exact state the
        # auto-rollback step below leaves behind. `update-traffic --to-latest`
        # re-routes 100% to whatever revision was just deployed, undoing any
        # prior pin. Idempotent when traffic is already on latest.
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --to-latest \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }}

      - name: Get service URL
        id: url
        run: |
          # Direct Cloud Run URL (.run.app) — always resolved. The smoke test
          # hits THIS so the health check reaches the just-promoted revision
          # directly, with no Cloud CDN edge / LB serverless-NEG propagation or
          # cold-start race (which otherwise yields false smoke failures and an
          # unnecessary auto-rollback even when the revision is healthy).
          RUN_URL=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }} \
            --format='value(status.url)')
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          # Public/display URL: the custom domain when fronted by a LB+CDN, else
          # the run.app. Used for CDN invalidation and the deployment env URL.
          if [ -n "${{ inputs.cdn_host }}" ]; then
            echo "url=https://${{ inputs.cdn_host }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          fi

      # ================================================================
      # SMOKE TEST
      # ================================================================
      - name: Smoke test
        id: smoke
        if: inputs.smoke_test_path != ''
        run: |
          # Hit the Cloud Run revision directly (run.app) first — robust against
          # CDN/LB cold-start propagation. Fall back to the public URL so
          # ingress-restricted services (e.g. IAP / LB-only) are still covered;
          # when there's no cdn_host the two URLs are identical (extra retries).
          for BASE in "${{ steps.url.outputs.run_url }}" "${{ steps.url.outputs.url }}"; do
            URL="${BASE}${{ inputs.smoke_test_path }}"
            for i in 1 2 3; do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
                echo "Smoke test passed (HTTP $STATUS) on $URL"
                exit 0
              fi
              echo "Attempt $i on $URL: HTTP $STATUS"
            done
          done
          echo "Smoke test FAILED"
          exit 1

      # ================================================================
      # ATOMIC TAG MOVES — only after deploy + smoke success
      # Every operation below references the digests resolved upfront, so
      # nothing we touch depends on mutable tags that might have moved.
      #   pro-previous → old pro-latest digest (if one existed)
      #   pro-latest   → new src digest
      #   v1.x.x       → new src digest (when promoting a semver)
      # ================================================================
      - name: Move AR tags (pro-latest, pro-previous, semver)
        if: success()
        env:
          AR_IMAGE: ${{ steps.src.outputs.ar_image }}
          SRC_DIGEST: ${{ steps.src.outputs.digest }}
          PREV_DIGEST: ${{ steps.prev.outputs.digest }}
          IS_SEMVER: ${{ steps.version.outputs.is_semver }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
        run: |
          if [ -n "$PREV_DIGEST" ]; then
            echo "Moving pro-previous → ${PREV_DIGEST}"
            gcloud artifacts docker tags add "${AR_IMAGE}@${PREV_DIGEST}" "${AR_IMAGE}:pro-previous"
          fi

          echo "Moving pro-latest → ${SRC_DIGEST}"
          gcloud artifacts docker tags add "${AR_IMAGE}@${SRC_DIGEST}" "${AR_IMAGE}:pro-latest"

          if [ "$IS_SEMVER" = "true" ]; then
            echo "Creating ${SEMVER_TAG} → ${SRC_DIGEST}"
            gcloud artifacts docker tags add "${AR_IMAGE}@${SRC_DIGEST}" "${AR_IMAGE}:${SEMVER_TAG}"
          fi

      # ================================================================
      # AUTO-ROLLBACK — any failure from deploy onwards
      # Tags weren't moved yet (the tag-move step runs only on success),
      # so AR is already in the correct pre-deploy state. Here we only
      # roll Cloud Run traffic back to the revision that was serving
      # before this promote started.
      # ================================================================
      - name: Auto-rollback
        if: failure() && steps.pre-deploy.outputs.revision != ''
        run: |
          echo "::warning::Promote failed — rolling back traffic to ${{ steps.pre-deploy.outputs.revision }}"
          gcloud run services update-traffic ${{ inputs.service }} \
            --to-revisions=${{ steps.pre-deploy.outputs.revision }}=100 \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }}

      # ================================================================
      # RECORD PREVIOUS-REVISION — service-level annotation for the
      # rollback-previous workflow to read instead of walking revisions.
      # ================================================================
      - name: Record previous-revision annotation
        if: success() && steps.pre-deploy.outputs.revision != ''
        run: |
          gcloud run services update ${{ inputs.service }} \
            --update-annotations="dogfydiet.com/previous-revision=${{ steps.pre-deploy.outputs.revision }}" \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }} \
            --quiet

      # ================================================================
      # CDN INVALIDATION — only on success
      # ================================================================
      - name: Invalidate CDN cache
        if: success() && inputs.cdn_host != '' && vars.CDN_URL_MAP != ''
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.CDN_URL_MAP }} \
            --host="${{ inputs.cdn_host }}" \
            --path="/*" \
            --project=${{ vars.GCP_PROJECT }} \
            --async

      # ================================================================
      # REGISTER GITHUB DEPLOYMENT
      # ================================================================
      - name: Register deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          DESCRIPTION: "${{ inputs.service }} @${{ steps.src.outputs.digest }}"
          ENVIRONMENT_URL: ${{ steps.url.outputs.url }}
        run: |
          # required_contexts: [] so the promote isn't blocked by unrelated
          # commit status checks on the target SHA. gh api's -f/-F can't encode
          # an empty JSON array, so build the body with jq and feed via --input.
          DEPLOY_ID=$(jq -n \
            --arg ref "$REF" \
            --arg env "$ENVIRONMENT" \
            --arg desc "$DESCRIPTION" \
            '{ref: $ref, environment: $env, description: $desc, auto_merge: false, required_contexts: []}' \
            | gh api "repos/${{ github.repository }}/deployments" --input - --jq '.id')
          gh api "repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses" \
            -f state=success \
            -f environment_url="$ENVIRONMENT_URL" \
            -f description="$DESCRIPTION"

      # ================================================================
      # SUMMARY
      # ================================================================
      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Promote: ${{ inputs.service }} → ${{ inputs.environment }}
          | | |
          |---|---|
          | Image | \`${{ steps.src.outputs.ar_image }}\` |
          | Digest | \`${{ steps.src.outputs.digest }}\` |
          | URL | ${{ steps.url.outputs.url }} |
          | Version input | \`${{ inputs.version || '(auto)' }}\` |
          | Resolved source | \`${{ steps.version.outputs.src_tag }}\` |
          | Image revision | \`${{ steps.provenance.outputs.image_revision }}\` |
          | Verified Git tree | \`${{ steps.provenance.outputs.image_tree }}\` |
          | Semver applied | ${{ steps.version.outputs.semver_tag || '(none)' }} |
          | CDN Invalidation | ${{ inputs.cdn_host || 'skipped' }} |
          EOF
