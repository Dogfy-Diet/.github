# =============================================================================
# REUSABLE WORKFLOW: DEPLOYMENT NOTIFICATION
# =============================================================================
# Renders one compact Slack Block Kit message for a completed deployment,
# promotion, rollback, or blocked production attempt.
#
# The workflow is deliberately transport-optional:
#   - With dry_run=true (or without Slack credentials), it renders the exact
#     message into the GitHub step summary and does not call Slack.
#   - With a bot token and channel ID, it posts through chat.postMessage.
#
# This keeps notification rollout independent from deployment rollout and lets
# delivery-e2e-lab exercise every message shape before a real channel is wired.
# A Slack failure never turns a successful deployment into a failed deployment.
# =============================================================================
name: Notify Deployment

on:
  workflow_call:
    inputs:
      application:
        type: string
        default: ""
        description: "Human-friendly app/repository name. Defaults to the repository name."
      service:
        required: true
        type: string
        description: "Deployed service (for example dogfy-admin)."
      environment:
        required: true
        type: string
        description: "stg/staging, pro/production, or another explicit environment."
      operation:
        required: true
        type: string
        description: "deploy, promote, rollback, or preflight."
      status:
        required: true
        type: string
        description: "success, failure, blocked, or cancelled."
      commit:
        type: string
        default: ""
        description: "Commit associated with the artefact. Defaults to github.sha."
      git_tree:
        type: string
        default: ""
        description: "Optional verified Git tree SHA."
      provenance_status:
        type: string
        default: "unknown"
        description: "verified, failed, not_applicable, or unknown."
      image_digest:
        type: string
        default: ""
        description: "Immutable deployed image digest."
      service_url:
        type: string
        default: ""
        description: "Environment/service URL shown as an Open service button."
      pr_number:
        type: string
        default: ""
      pr_url:
        type: string
        default: ""
      pr_title:
        type: string
        default: ""
        description: "Optional PR title. Automatically resolved when GitHub correlation finds a PR."
      jira_key:
        type: string
        default: ""
      jira_url:
        type: string
        default: ""
      jira_title:
        type: string
        default: ""
        description: "Optional Jira summary. When empty, the workflow resolves it with read-only Jira credentials."
      jira_base_url:
        type: string
        default: "https://dogfydiet.atlassian.net"
        description: "Atlassian site used to build issue links and resolve Jira summaries."
      jira_cloud_id:
        type: string
        default: "ecd3d26f-6f08-4f34-a5fa-f82dd18c5e7d"
        description: "Atlassian cloud ID used by scoped service-account tokens."
      run_url:
        type: string
        default: ""
        description: "Defaults to the current GitHub Actions run."
      runbook_url:
        type: string
        default: ""
      smoke_test_status:
        type: string
        default: "unknown"
        description: "passed, failed, skipped, or unknown."
      traffic_changed:
        type: boolean
        default: false
        description: "Whether the workflow changed environment traffic."
      reason:
        type: string
        default: ""
        description: "Short failure/block reason; never pass logs or secrets."
      actor:
        type: string
        default: ""
        description: "Defaults to github.actor."
      channel_id:
        type: string
        default: ""
        description: "Explicit Slack channel ID. Missing configuration renders only and never posts."
      dry_run:
        type: boolean
        default: false
        description: "Render the message without posting it."
    secrets:
      slack_bot_token:
        required: false
        description: "Slack bot token with chat:write."
      jira_user_email:
        required: false
        description: "Account email for an existing Basic Auth Jira token. Leave empty for scoped Bearer auth."
      jira_api_token:
        required: false
        description: "Jira API token. Prefer a scoped read:jira-work service-account token."
    outputs:
      posted:
        description: "true when Slack accepted the message."
        value: ${{ jobs.notify.outputs.posted }}
      message_ts:
        description: "Slack message timestamp when posted."
        value: ${{ jobs.notify.outputs.message_ts }}
      jira_key:
        description: "Explicit or automatically inferred Jira issue key."
        value: ${{ jobs.notify.outputs.jira_key }}
      jira_source:
        description: "GitHub context field used to infer jira_key."
        value: ${{ jobs.notify.outputs.jira_source }}
      pr_number:
        description: "Explicit, event-derived, or commit-associated pull request number."
        value: ${{ jobs.notify.outputs.pr_number }}

jobs:
  notify:
    name: "Notify ${{ inputs.service }} on ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
      SLACK_CHANNEL_ID: ${{ inputs.channel_id }}
    outputs:
      posted: ${{ steps.publish.outputs.posted || 'false' }}
      message_ts: ${{ steps.publish.outputs.message_ts || '' }}
      jira_key: ${{ steps.render.outputs.jira_key || '' }}
      jira_source: ${{ steps.render.outputs.jira_source || 'none' }}
      pr_number: ${{ steps.render.outputs.pr_number || '' }}

    steps:
      - name: Render Slack Block Kit payload
        id: render
        shell: bash
        env:
          INPUT_APPLICATION: ${{ inputs.application }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_GIT_TREE: ${{ inputs.git_tree }}
          INPUT_PROVENANCE_STATUS: ${{ inputs.provenance_status }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          INPUT_SERVICE_URL: ${{ inputs.service_url }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PR_URL: ${{ inputs.pr_url }}
          INPUT_PR_TITLE: ${{ inputs.pr_title }}
          INPUT_JIRA_KEY: ${{ inputs.jira_key }}
          INPUT_JIRA_URL: ${{ inputs.jira_url }}
          INPUT_JIRA_TITLE: ${{ inputs.jira_title }}
          INPUT_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
          INPUT_JIRA_CLOUD_ID: ${{ inputs.jira_cloud_id }}
          INPUT_RUN_URL: ${{ inputs.run_url }}
          INPUT_RUNBOOK_URL: ${{ inputs.runbook_url }}
          INPUT_SMOKE_TEST_STATUS: ${{ inputs.smoke_test_status }}
          INPUT_TRAFFIC_CHANGED: ${{ inputs.traffic_changed }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_ACTOR: ${{ inputs.actor }}
          INPUT_CHANNEL_ID: ${{ inputs.channel_id }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          GH_TOKEN: ${{ github.token }}
          JIRA_USER_EMAIL: ${{ secrets.jira_user_email }}
          JIRA_API_TOKEN: ${{ secrets.jira_api_token }}
        run: |
          set -euo pipefail

          APP="${INPUT_APPLICATION:-${GITHUB_REPOSITORY#*/}}"
          COMMIT="${INPUT_COMMIT:-$GITHUB_SHA}"
          RUN_URL="${INPUT_RUN_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          PR_URL="${INPUT_PR_URL:-$EVENT_PR_URL}"
          PR_TITLE="${INPUT_PR_TITLE:-$EVENT_PR_TITLE}"
          JIRA_KEY="$INPUT_JIRA_KEY"
          JIRA_URL="$INPUT_JIRA_URL"
          JIRA_TITLE="$INPUT_JIRA_TITLE"
          JIRA_BASE_URL="${INPUT_JIRA_BASE_URL%/}"
          JIRA_BASE_URL="${JIRA_BASE_URL:-https://dogfydiet.atlassian.net}"
          JIRA_CLOUD_ID="$INPUT_JIRA_CLOUD_ID"
          JIRA_SOURCE="none"
          WORKFLOW_RUN_PR_NUMBER=""
          WORKFLOW_RUN_PR_HEAD_REF=""
          WORKFLOW_RUN_PR_TITLE=""
          WORKFLOW_RUN_PR_BODY=""
          ASSOCIATED_PR_HEAD_REF=""
          ASSOCIATED_PR_TITLE=""
          ASSOCIATED_PR_BODY=""

          extract_jira_key() {
            while IFS= read -r CANDIDATE; do
              PROJECT_KEY="${CANDIDATE%%-*}"
              # Branch/release metadata can look like a Jira key. Never turn
              # those structural tokens into misleading issue links.
              case "$PROJECT_KEY" in
                SPRINT|RELEASE|SHA|PR) continue ;;
              esac
              printf '%s\n' "$CANDIDATE"
              break
            done < <(
              printf '%s' "$1" \
                | tr '[:lower:]' '[:upper:]' \
                | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' \
                || true
            )
          }

          if [ -n "$JIRA_KEY" ]; then
            JIRA_KEY=$(extract_jira_key "$JIRA_KEY")
            if [ -n "$JIRA_KEY" ]; then
              JIRA_SOURCE="input"
            fi
          elif [ -n "$JIRA_URL" ]; then
            JIRA_KEY=$(extract_jira_key "$JIRA_URL")
            if [ -n "$JIRA_KEY" ]; then
              JIRA_SOURCE="jira_url"
            fi
          fi

          # workflow_run events do not reliably populate workflow_run.pull_requests.
          # For a source pull_request run, resolve the exact PR from its head branch
          # and commit before considering any other PR associated with the SHA.
          if [ -z "$EVENT_PR_NUMBER" ] \
            && [ "$GITHUB_EVENT_NAME" = workflow_run ] \
            && [ "$EVENT_WORKFLOW_RUN_EVENT" = pull_request ] \
            && [ -n "$EVENT_WORKFLOW_RUN_HEAD_BRANCH" ] \
            && { [ -z "$PR_NUMBER" ] || [ -z "$JIRA_KEY" ]; }; then
            WORKFLOW_RUN_HEAD_OWNER="${EVENT_WORKFLOW_RUN_HEAD_REPOSITORY%%/*}"
            WORKFLOW_RUN_HEAD_OWNER="${WORKFLOW_RUN_HEAD_OWNER:-$GITHUB_REPOSITORY_OWNER}"
            WORKFLOW_RUN_PRS=$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=all \
              -f head="${WORKFLOW_RUN_HEAD_OWNER}:${EVENT_WORKFLOW_RUN_HEAD_BRANCH}" \
              -f per_page=100 \
              2>/dev/null || printf '[]')
            WORKFLOW_RUN_PR=$(jq -c --arg commit "$COMMIT" '
              (map(select(.head.sha == $commit)) | sort_by(.updated_at // "") | reverse | .[0])
              // (sort_by(.updated_at // "") | reverse | .[0])
              // empty
            ' <<< "$WORKFLOW_RUN_PRS")

            if [ -n "$WORKFLOW_RUN_PR" ]; then
              WORKFLOW_RUN_PR_NUMBER=$(jq -r '.number // empty' <<< "$WORKFLOW_RUN_PR")
              if [ -z "$PR_NUMBER" ]; then
                PR_NUMBER="$WORKFLOW_RUN_PR_NUMBER"
              fi
              if [ -z "$PR_URL" ]; then
                PR_URL=$(jq -r '.html_url // empty' <<< "$WORKFLOW_RUN_PR")
              fi
              if [ -z "$PR_TITLE" ]; then
                PR_TITLE=$(jq -r '.title // empty' <<< "$WORKFLOW_RUN_PR")
              fi
              WORKFLOW_RUN_PR_HEAD_REF=$(jq -r '.head.ref // empty' <<< "$WORKFLOW_RUN_PR")
              WORKFLOW_RUN_PR_TITLE=$(jq -r '.title // empty' <<< "$WORKFLOW_RUN_PR")
              WORKFLOW_RUN_PR_BODY=$(jq -r '.body // empty' <<< "$WORKFLOW_RUN_PR")
            fi
          fi

          # A push deployment has no pull_request object. Ask GitHub for the PR
          # associated with the artefact commit so squash and merge commits both
          # retain their PR/Jira correlation. For workflow_run, only do this for
          # a source push: a pull_request source was resolved by head branch above,
          # while a manual dispatch has no reliable PR to infer.
          ALLOW_COMMIT_PR_LOOKUP=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$EVENT_WORKFLOW_RUN_EVENT" != push ]; then
            ALLOW_COMMIT_PR_LOOKUP=false
          fi
          if [ "$ALLOW_COMMIT_PR_LOOKUP" = true ] \
            && [ -z "$EVENT_PR_NUMBER" ] \
            && [ -z "$WORKFLOW_RUN_PR_NUMBER" ] \
            && { [ -z "$PR_NUMBER" ] || [ -z "$JIRA_KEY" ]; }; then
            ASSOCIATED_PR=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/pulls" \
              --jq 'sort_by(.merged_at // .updated_at) | reverse | .[0] // empty' \
              2>/dev/null || true)

            if [ -n "$ASSOCIATED_PR" ]; then
              if [ -z "$PR_NUMBER" ]; then
                PR_NUMBER=$(jq -r '.number // empty' <<< "$ASSOCIATED_PR")
              fi
              if [ -z "$PR_URL" ]; then
                PR_URL=$(jq -r '.html_url // empty' <<< "$ASSOCIATED_PR")
              fi
              if [ -z "$PR_TITLE" ]; then
                PR_TITLE=$(jq -r '.title // empty' <<< "$ASSOCIATED_PR")
              fi
              ASSOCIATED_PR_HEAD_REF=$(jq -r '.head.ref // empty' <<< "$ASSOCIATED_PR")
              ASSOCIATED_PR_TITLE=$(jq -r '.title // empty' <<< "$ASSOCIATED_PR")
              ASSOCIATED_PR_BODY=$(jq -r '.body // empty' <<< "$ASSOCIATED_PR")
            fi
          fi

          if [ -z "$JIRA_KEY" ]; then
            SOURCE_NAMES=(
              "pull_request.head.ref"
              "pull_request.title"
              "pull_request.body"
              "workflow_run.pull_request.head.ref"
              "workflow_run.pull_request.title"
              "workflow_run.pull_request.body"
              "associated_pull_request.head.ref"
              "associated_pull_request.title"
              "associated_pull_request.body"
              "head_commit.message"
              "ref_name"
            )
            SOURCE_VALUES=(
              "$EVENT_PR_HEAD_REF"
              "$EVENT_PR_TITLE"
              "$EVENT_PR_BODY"
              "$WORKFLOW_RUN_PR_HEAD_REF"
              "$WORKFLOW_RUN_PR_TITLE"
              "$WORKFLOW_RUN_PR_BODY"
              "$ASSOCIATED_PR_HEAD_REF"
              "$ASSOCIATED_PR_TITLE"
              "$ASSOCIATED_PR_BODY"
              "$EVENT_HEAD_COMMIT_MESSAGE"
              "$GITHUB_REF_NAME"
            )

            for INDEX in "${!SOURCE_VALUES[@]}"; do
              CANDIDATE=$(extract_jira_key "${SOURCE_VALUES[$INDEX]}")
              if [ -n "$CANDIDATE" ]; then
                JIRA_KEY="$CANDIDATE"
                JIRA_SOURCE="${SOURCE_NAMES[$INDEX]}"
                break
              fi
            done
          fi

          if [ -z "$PR_URL" ] && [ -n "$PR_NUMBER" ]; then
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          fi
          if [ -z "$JIRA_URL" ] && [ -n "$JIRA_KEY" ]; then
            JIRA_URL="${JIRA_BASE_URL}/browse/${JIRA_KEY}"
          fi

          # Jira context is enrichment only. The request only reads `summary`,
          # and an unavailable/misconfigured Jira API must never affect the
          # deployment result or suppress its Slack notification.
          if [ -z "$JIRA_TITLE" ] && [ -n "$JIRA_KEY" ]; then
            if [ -n "$JIRA_API_TOKEN" ]; then
              JIRA_RESPONSE=""
              if [ -n "$JIRA_USER_EMAIL" ]; then
                JIRA_RESPONSE=$(curl --silent --show-error --fail \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                  --header 'Accept: application/json' \
                  --get \
                  --data-urlencode 'fields=summary' \
                  "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}" \
                  2>/dev/null) || JIRA_RESPONSE=""
              elif [ -n "$JIRA_CLOUD_ID" ]; then
                JIRA_RESPONSE=$(curl --silent --show-error --fail \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --header "Authorization: Bearer ${JIRA_API_TOKEN}" \
                  --header 'Accept: application/json' \
                  --get \
                  --data-urlencode 'fields=summary' \
                  "https://api.atlassian.com/ex/jira/${JIRA_CLOUD_ID}/rest/api/3/issue/${JIRA_KEY}" \
                  2>/dev/null) || JIRA_RESPONSE=""
              fi

              if [ -n "$JIRA_RESPONSE" ]; then
                if JIRA_TITLE_CANDIDATE=$(jq -r '.fields.summary // empty' <<< "$JIRA_RESPONSE" 2>/dev/null); then
                  JIRA_TITLE="$JIRA_TITLE_CANDIDATE"
                else
                  echo "::warning::Jira returned an invalid response for ${JIRA_KEY}; using the issue key only."
                fi
              else
                echo "::warning::Could not resolve the Jira title for ${JIRA_KEY}; using the issue key only."
              fi
            else
              echo "::notice::Jira title lookup is not configured; using the issue key only."
            fi
          fi

          ENV_LOWER=$(printf '%s' "$INPUT_ENVIRONMENT" | tr '[:upper:]' '[:lower:]')
          OP_LOWER=$(printf '%s' "$INPUT_OPERATION" | tr '[:upper:]' '[:lower:]')
          STATUS_LOWER=$(printf '%s' "$INPUT_STATUS" | tr '[:upper:]' '[:lower:]')

          case "$ENV_LOWER" in
            stg|staging|*-stg) ENV_LABEL="STAGING" ;;
            pro|prod|production|*-pro) ENV_LABEL="PRODUCTION" ;;
            *) ENV_LABEL=$(printf '%s' "$INPUT_ENVIRONMENT" | tr '[:lower:]' '[:upper:]') ;;
          esac

          case "$STATUS_LOWER" in
            success) STATUS_ICON="✅"; STATUS_SUFFIX="" ;;
            blocked) STATUS_ICON="🛑"; STATUS_SUFFIX=" blocked" ;;
            cancelled) STATUS_ICON="⚪"; STATUS_SUFFIX=" cancelled" ;;
            *) STATUS_ICON="❌"; STATUS_SUFFIX=" failed" ;;
          esac

          case "$APP" in
            website) APP_LABEL="Website" ;;
            cust-web) APP_LABEL="Cust Web" ;;
            web-apps) APP_LABEL="Web Apps" ;;
            internal-apps) APP_LABEL="Internal Apps" ;;
            *) APP_LABEL="$APP" ;;
          esac

          case "$INPUT_SERVICE" in
            dogfy-website) SERVICE_LABEL="Website" ;;
            dogfy-cust) SERVICE_LABEL="Cust Web" ;;
            dogfy-admin) SERVICE_LABEL="Admin" ;;
            dogfy-backoffice) SERVICE_LABEL="Backoffice" ;;
            dogfy-picking) SERVICE_LABEL="Picking" ;;
            dogfy-sales) SERVICE_LABEL="Sales" ;;
            production-release) SERVICE_LABEL="$APP_LABEL" ;;
            *) SERVICE_LABEL="$INPUT_SERVICE" ;;
          esac

          case "$OP_LOWER" in
            rollback) ACTION_LABEL="Rollback" ;;
            preflight) ACTION_LABEL="Promotion" ;;
            *) ACTION_LABEL="Deploy" ;;
          esac

          DEPLOYED_AT=$(date +%s)
          TIME_FALLBACK=$(date +%H:%M:%S)
          TIME_MARKUP="<!date^${DEPLOYED_AT}^{time_secs}|${TIME_FALLBACK}>"

          compact_link_label() {
            printf '%s' "$1" \
              | tr '\r\n' '  ' \
              | sed -E 's/[[:space:]]+/ /g; s/[|]/-/g; s/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' \
              | cut -c1-110
          }

          PR_TITLE_DISPLAY=$(compact_link_label "$PR_TITLE")
          JIRA_TITLE_DISPLAY=$(compact_link_label "$JIRA_TITLE")
          PR_LINK_LABEL=""
          JIRA_LINK_LABEL=""
          if [ -n "$PR_URL" ]; then
            PR_LINK_LABEL="PR${PR_NUMBER:+ #${PR_NUMBER}}"
            if [ -n "$PR_TITLE_DISPLAY" ]; then
              PR_LINK_LABEL="${PR_LINK_LABEL} — ${PR_TITLE_DISPLAY}"
            fi
          fi
          if [ -n "$JIRA_URL" ]; then
            JIRA_LINK_LABEL="${JIRA_KEY:-Jira}"
            if [ -n "$JIRA_TITLE_DISPLAY" ]; then
              JIRA_LINK_LABEL="${JIRA_LINK_LABEL} — ${JIRA_TITLE_DISPLAY}"
            fi
          fi

          TITLE="${STATUS_ICON} *[${ENV_LABEL}] ${ACTION_LABEL} ${SERVICE_LABEL}${STATUS_SUFFIX}*"
          LINE="${TITLE} · ${TIME_MARKUP}"
          if [ -n "$PR_LINK_LABEL" ]; then
            LINE="${LINE} · <${PR_URL}|${PR_LINK_LABEL}>"
          fi
          if [ -n "$JIRA_LINK_LABEL" ]; then
            LINE="${LINE} · <${JIRA_URL}|${JIRA_LINK_LABEL}>"
          fi
          RUN_LABEL="View run"
          if [ "$STATUS_LOWER" = failure ] || [ "$STATUS_LOWER" = blocked ]; then
            RUN_LABEL="View error"
          fi
          LINE="${LINE} · <${RUN_URL}|${RUN_LABEL}>"
          FALLBACK="[${ENV_LABEL}] ${ACTION_LABEL} ${SERVICE_LABEL}${STATUS_SUFFIX} - ${TIME_FALLBACK} - ${RUN_URL}"

          PAYLOAD=$(jq -n \
            --arg channel "$INPUT_CHANNEL_ID" \
            --arg line "$LINE" \
            --arg fallback "$FALLBACK" \
            '
              {
                channel: $channel,
                text: $fallback,
                unfurl_links: false,
                unfurl_media: false,
                blocks: [
                  {
                    type: "section",
                    text: {type: "mrkdwn", text: $line}
                  }
                ]
              }
            ')

          {
            echo 'payload<<SLACK_PAYLOAD'
            echo "$PAYLOAD"
            echo 'SLACK_PAYLOAD'
            echo "jira_key=$JIRA_KEY"
            echo "jira_source=$JIRA_SOURCE"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## ${STATUS_ICON} [${ENV_LABEL}] ${ACTION_LABEL} ${SERVICE_LABEL}${STATUS_SUFFIX}"
            echo
            echo "$LINE"
            echo
            echo '```json'
            echo "$PAYLOAD"
            echo '```'
            echo
            echo "Correlation: Jira \`${JIRA_KEY:-none}\` from \`${JIRA_SOURCE}\`; PR \`${PR_NUMBER:-none}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Slack
        id: publish
        if: ${{ !inputs.dry_run && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        continue-on-error: true
        shell: bash
        env:
          PAYLOAD: ${{ steps.render.outputs.payload }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD" \
            https://slack.com/api/chat.postMessage)

          if [ "$(jq -r '.ok // false' <<< "$RESPONSE")" = "true" ]; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
            echo "message_ts=$(jq -r '.ts // ""' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
            echo "Slack accepted the deployment notification."
          else
            ERROR=$(jq -r '.error // "unknown_error"' <<< "$RESPONSE")
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "message_ts=" >> "$GITHUB_OUTPUT"
            echo "::warning::Slack notification failed (${ERROR}); deployment result is unchanged."
          fi

      - name: Explain dry-run or missing configuration
        if: ${{ inputs.dry_run || env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == '' }}
        shell: bash
        run: |
          echo "Notification rendered only; Slack was not contacted."
