# =============================================================================
# REUSABLE WORKFLOW: CLEANUP PREVIEW
# =============================================================================
# Removes the Cloud Run traffic tag and AR image tag for a closed PR.
# Called from the caller workflow on pull_request.closed events.
#
# Without this, stale previews linger until the next staging deploy.
# This gives immediate cleanup when a PR is closed or merged.
#
# Destination: Dogfy-Diet/.github/.github/workflows/cleanup-preview.yml
#
# Required GitHub variables:
#   Repository level : AR_REPO
#   Environment "stg": GCP_PROJECT, SA_EMAIL, WIF_PROVIDER
# =============================================================================
name: Cleanup Preview

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      region:
        type: string
        default: "europe-west1"
      sa_email:
        type: string
        default: ""
        description: "Deployer SA email. For monorepos with multiple services. Defaults to vars.SA_EMAIL if empty."

jobs:
  cleanup:
    name: "Cleanup PR preview"
    runs-on: ubuntu-latest
    environment: stg
    # Same group as preview-cloud-run's deploy job. Closing a PR while a
    # preview is still deploying would otherwise let the in-flight deploy
    # re-create the traffic tag right after cleanup removed it, leaving an
    # orphaned tag+revision (Cloud Run never GCs tagged revisions). Sharing
    # the group with cancel-in-progress cancels that in-flight preview first.
    concurrency:
      group: preview-${{ inputs.service }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ inputs.sa_email || vars.SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Remove traffic tag
        # not-found is benign (tag already gone or preview never ran), but a
        # real failure (IAM, API outage) must fail the job — previously both
        # were swallowed by 2>/dev/null and reported as "not found".
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          echo "Removing Cloud Run traffic tag: $TAG"
          if OUT=$(gcloud run services update-traffic ${{ inputs.service }} \
            --remove-tags="$TAG" \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }} 2>&1); then
            echo "Removed traffic tag $TAG"
          elif echo "$OUT" | grep -qiE "not found|does not exist"; then
            echo "Traffic tag $TAG not found (already removed or never created)"
          else
            echo "$OUT"
            echo "::error::Failed to remove traffic tag $TAG"
            exit 1
          fi

      - name: Delete preview image tag
        # Keep the pr-<N> AR tag on merge — deploy-cloud-run reads it to
        # reuse the preview image and skip Build & Push. Aged pr-* tags are
        # pruned server-side by the AR cleanup policies (ADR-014 in the
        # infrastructure repo; >14d), which replace the cleanup-ar-tags cron.
        # When a PR is closed WITHOUT merging, there's nothing to reuse so we
        # delete the tag immediately (the untagged digest is then collected
        # by the delete-old-untagged policy).
        if: github.event.pull_request.merged == false
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE="${{ vars.AR_REPO }}/${{ inputs.service }}"
          # Bare pr-<N> plus every commit-bound pr-<N>-<sha7> tag pushed by
          # this PR's preview builds. Anchored regex so pr-1 never matches
          # pr-12 or pr-12-<sha7>.
          TAGS=$(gcloud artifacts docker tags list "$IMAGE" \
            --format='value(tag)' 2>/dev/null | grep -E "^pr-${PR_NUMBER}(-[0-9a-f]{7})?$" || true)
          if [ -z "$TAGS" ]; then
            echo "No pr-${PR_NUMBER} image tags found (never pushed or already deleted)"
            exit 0
          fi
          FAILED=0
          for TAG in $TAGS; do
            if OUT=$(gcloud artifacts docker tags delete "$IMAGE:$TAG" --quiet 2>&1); then
              echo "Deleted image tag $TAG"
            elif echo "$OUT" | grep -qiE "not found|NOT_FOUND|404"; then
              echo "Image tag $TAG already gone"
            else
              echo "$OUT"
              echo "::error::Failed to delete AR image tag $TAG"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Cleanup: ${{ inputs.service }} PR #${{ github.event.pull_request.number }}
          Removed traffic tag and AR image tag for closed PR.
          EOF
