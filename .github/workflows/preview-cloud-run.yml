# =============================================================================
# REUSABLE WORKFLOW: PREVIEW CLOUD RUN
# =============================================================================
# Builds and deploys an ephemeral preview using Cloud Run traffic tags.
# The preview shares staging infra (DB, secrets) but receives no live traffic.
#
# Destination: Dogfy-Diet/.github/.github/workflows/preview-cloud-run.yml
#
# Required GitHub variables:
#   Repository level : AR_REPO      (e.g. europe-west1-docker.pkg.dev/dogfy-host/docker)
#   Per environment  : GCP_PROJECT  (e.g. dogfy-platform-stg)
#                      SA_EMAIL     (deployer SA for this service)
#                      WIF_PROVIDER (WIF provider full resource name)
#   The environment defaults to "stg"; single-env repos (e.g. apps living in
#   dogfy-automation) override it via the `environment` input.
#
# Infra prerequisites:
#   - Cloud Run service must have ingress = INGRESS_TRAFFIC_ALL (staging only)
#     so the tagged URL https://pr-N---service.a.run.app is reachable.
#   - Deployer SA needs roles/artifactregistry.writer on the AR_REPO project.
#   - Cloud Run service agent needs roles/artifactregistry.reader on AR_REPO project.
# =============================================================================
name: Preview Cloud Run

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "Cloud Run service name (must match Terraform, e.g. dogfy-new-help-center)"
      environment:
        type: string
        default: "stg"
        description: "GitHub environment holding GCP_PROJECT / SA_EMAIL / WIF_PROVIDER (e.g. stg, automation)."
      region:
        type: string
        default: "europe-west1"
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      build_args:
        type: string
        default: ""
      # Prebuild steps (opt-in). Set these only if the Dockerfile expects
      # pre-built artifacts (e.g. npm run build output) in the build context.
      # If the Dockerfile is self-contained (multi-stage), leave empty.
      node_version:
        type: string
        default: ""
      install_command:
        type: string
        default: ""
      build_command:
        type: string
        default: ""
        description: |
          Optional runner-side command executed after install and before the
          Docker build. It may materialize dynamic build inputs into the context.
      build_secret_manager_secrets:
        type: string
        default: ""
        description: |
          Optional Secret Manager mappings exposed only to build_command.
          Format: ENV_NAME:GCP_PROJECT/SECRET_NAME, one mapping per line.
      smoke_test_path:
        type: string
        default: ""
        description: "Health check path for preview (e.g. /health). Empty = skip."
      sa_email:
        type: string
        default: ""
        description: "Deployer SA email. For monorepos with multiple services. Defaults to vars.SA_EMAIL if empty."
      submodules:
        type: string
        default: "false"
        description: "Fetch git submodules on checkout. 'true', 'recursive', or 'false'. For private submodules, also pass submodules_token."
      cache_node_modules:
        type: boolean
        default: true
        description: "Cache node_modules across runs (key = package-lock.json hash). Ignored if install_command is empty."
      build_cache_path:
        type: string
        default: ""
        description: "Directory to cache across runs for incremental builds (e.g. 'apps/website/.nuxt'). Keyed by service + PR number."
      env_vars:
        type: string
        default: ""
        description: |
          Multiline KEY=VALUE env vars exposed to the install/build steps.
          App-specific — use for stub values required by framework init
          during `nuxt build` and similar.
    secrets:
      submodules_token:
        required: false
        description: "PAT with read access to private submodule repos. Only needed when submodules live in private repos the GITHUB_TOKEN cannot reach."
    outputs:
      preview_url:
        value: ${{ jobs.preview.outputs.url }}

jobs:
  preview:
    name: "Deploy PR preview"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: preview-${{ inputs.service }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      url: ${{ steps.preview-url.outputs.url }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Fetch private submodules separately so the main checkout keeps using
      # GITHUB_TOKEN and the PAT only authorizes the submodule fetch.
      - name: Fetch submodules
        if: inputs.submodules == 'true' || inputs.submodules == 'recursive'
        env:
          SUBMODULE_TOKEN: ${{ secrets.submodules_token || github.token }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          if [ "${{ inputs.submodules }}" = "recursive" ]; then
            git submodule update --init --recursive
          else
            git submodule update --init
          fi
          git config --global --unset url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf

      # -- Optional prebuild ------------------------------------------------
      - uses: actions/setup-node@v4
        if: inputs.node_version != ''
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Restore node_modules cache
        if: inputs.install_command != '' && inputs.cache_node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-nm-${{ inputs.service }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nm-${{ inputs.service }}-

      - name: Load app-specific env vars
        if: inputs.env_vars != ''
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in \#*) continue ;; esac
            echo "$line" >> "$GITHUB_ENV"
          done <<< "${{ inputs.env_vars }}"

      - if: inputs.install_command != ''
        env:
          # Exposed for installs that fetch private git npm dependencies (e.g.
          # website's @dogfy-diet/external-packages). Same PAT the caller
          # already passes for submodules; empty string when not passed, so
          # callers that don't reference it are unaffected.
          GIT_AUTH_TOKEN: ${{ secrets.submodules_token }}
        run: ${{ inputs.install_command }}

      # Build cache keyed by commit SHA within the PR scope. Restore-keys
      # scope is limited to "same PR" so we don't pull cached Nuxt chunks
      # from another PR (different translations/components) that would be
      # reused incorrectly. First push of a PR does a cold build; further
      # pushes on the same PR can reuse the incremental cache from the
      # previous commit of the SAME PR.
      - name: Restore build cache
        if: inputs.build_cache_path != ''
        uses: actions/cache@v4
        with:
          path: ${{ inputs.build_cache_path }}
          key: ${{ runner.os }}-build-${{ inputs.service }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ inputs.service }}-pr-${{ github.event.pull_request.number }}-

      # Authenticate after dependency installation but before optional
      # runner-side inputs need to read explicitly mapped build secrets.
      - uses: google-github-actions/auth@v2
        id: gcp-auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ inputs.sa_email || vars.SA_EMAIL }}

      - name: Keep Google credentials outside the Docker context
        env:
          GENERATED_CREDENTIALS_PATH: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          SAFE_CREDENTIALS_PATH="${RUNNER_TEMP}/gha-creds-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          mv "$GENERATED_CREDENTIALS_PATH" "$SAFE_CREDENTIALS_PATH"
          chmod 600 "$SAFE_CREDENTIALS_PATH"
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$SAFE_CREDENTIALS_PATH"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$SAFE_CREDENTIALS_PATH"
            echo "GOOGLE_GHA_CREDS_PATH=$SAFE_CREDENTIALS_PATH"
          } >> "$GITHUB_ENV"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Load build secrets from Secret Manager
        id: build-secrets
        if: inputs.build_command != '' && inputs.build_secret_manager_secrets != ''
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: ${{ inputs.build_secret_manager_secrets }}
          export_to_environment: false

      - name: Run runner-side build command
        if: inputs.build_command != ''
        env:
          # Exposed for builds that need to fetch private resources (e.g.
          # @nuxt/content's repository source pulling a private submodule).
          # Reuses the same PAT the caller passes via `submodules_token`.
          GITHUB_API_TOKEN: ${{ secrets.submodules_token }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          BUILD_SECRETS_JSON: ${{ toJSON(steps.build-secrets.outputs) }}
        run: |
          set -euo pipefail

          # Secret Manager output names become environment variables only for
          # this step. Values remain masked and are not inherited by Docker.
          while IFS= read -r name; do
            if [[ ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::Invalid build secret environment name: ${name}"
              exit 1
            fi

            value=$(jq -r --arg name "$name" '.[$name]' <<< "$BUILD_SECRETS_JSON")
            export "$name=$value"
          done < <(jq -r '(. // {}) | keys[]' <<< "$BUILD_SECRETS_JSON")

          bash -eo pipefail -c "$BUILD_COMMAND"

      # -- Build ------------------------------------------------------------
      - run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      # -- Build & push to centralized AR -----------------------------------
      - uses: docker/setup-buildx-action@v3

      # On pull_request events github.sha is the synthetic test-merge commit,
      # so the image↔commit binding tag must use the PR head SHA instead. The
      # synthetic commit can be garbage-collected after the PR closes, so also
      # persist the exact checked-out tree in the image for durable retries.
      - name: Compute commit-bound tag
        id: head-tag
        run: |
          echo "sha7=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # Two tags per build:
      #   pr-<N>        → human-friendly "latest preview of this PR"
      #   pr-<N>-<sha7> → image↔commit binding. deploy-cloud-run's
      #                   preview-reuse only trusts THIS tag: if the head
      #                   commit's preview build failed or was cancelled, the
      #                   bound tag is absent and the deploy falls back to a
      #                   fresh build instead of reusing a stale image.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ vars.AR_REPO }}/${{ inputs.service }}:pr-${{ github.event.pull_request.number }}
            ${{ vars.AR_REPO }}/${{ inputs.service }}:pr-${{ github.event.pull_request.number }}-${{ steps.head-tag.outputs.sha7 }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=registry,ref=${{ vars.AR_REPO }}/${{ inputs.service }}:buildcache
          cache-to: type=registry,ref=${{ vars.AR_REPO }}/${{ inputs.service }}:buildcache,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.dogfy.git.tree=${{ steps.head-tag.outputs.tree }}

      # -- Deploy as tagged revision (no traffic) ---------------------------
      - name: Deploy preview
        run: |
          gcloud run deploy ${{ inputs.service }} \
            --image=${{ vars.AR_REPO }}/${{ inputs.service }}:pr-${{ github.event.pull_request.number }} \
            --tag=pr-${{ github.event.pull_request.number }} \
            --no-traffic \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }}

      - name: Get preview URL
        id: preview-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.region }} \
            --project=${{ vars.GCP_PROJECT }} \
            --format='value(status.url)')
          URL=$(echo "$SERVICE_URL" | sed "s|https://|https://pr-${{ github.event.pull_request.number }}---|")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        if: inputs.smoke_test_path != ''
        run: |
          URL="${{ steps.preview-url.outputs.url }}${{ inputs.smoke_test_path }}"
          for i in 1 2 3; do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Preview smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"
          done
          echo "::warning::Preview smoke test failed (last HTTP $STATUS) — preview may need a moment to start"

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Preview deployed
            | | |
            |---|---|
            | Service | `${{ inputs.service }}` |
            | URL | ${{ steps.preview-url.outputs.url }} |
            | Commit | `${{ github.sha }}` |

            > Preview shares staging infra (DB, secrets). No production traffic.

      - name: Remove temporary Google credentials
        if: always()
        run: |
          if [ -n "${GOOGLE_GHA_CREDS_PATH:-}" ]; then
            rm -f -- "$GOOGLE_GHA_CREDS_PATH"
          fi
